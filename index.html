
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Moto Launcher</title>
  <style>
    body {
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    button {
      background: #2196f3;
      color: white;
      padding: 18px 28px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Moto Launcher</h2>
  <p>Spróbuj uruchomić aplikację Moto.</p>

  <button onclick="openMoto()">
    Otwórz aplikację Moto
  </button>

  <script>
    function openMoto() {
      window.location.href =
        "intent:#Intent;" +
        "package=com.motorola.moto;" +
        "end";
    }
  </script>

</body>
</html>
