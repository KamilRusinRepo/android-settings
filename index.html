
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Motorola System Update</title>
  <style>
    body {
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }
    button {
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 18px 25px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Motorola System Update</h2>
  <p>Otwórz ustawienia aktualizacji Androida.</p>

  <button onclick="openUpdate()">
    Sprawdź aktualizacje systemu
  </button>

  <script>
    function openUpdate() {
      window.location.href =
        "intent:#Intent;" +
        "action=android.settings.SYSTEM_UPDATE_SETTINGS;" +
        "package=com.android.settings;" +
        "end";
    }
  </script>
</body>
</html>
