
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Android PIN Settings</title>
  <style>
    body {
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    button {
      background: #2196f3;
      color: white;
      padding: 18px 28px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Android PIN Settings</h2>
  <p>Otwórz ustawienia blokady ekranu.</p>

  <button onclick="openPinSettings()">
    Ustawienia PIN-u
  </button>

  <script>
    function openPinSettings() {
      window.location.href =
        "intent:#Intent;" +
        "action=android.settings.SECURITY_SETTINGS;" +
        "package=com.android.settings;" +
        "end";
    }
  </script>
</body>
</html>
