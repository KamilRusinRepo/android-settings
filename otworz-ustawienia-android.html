<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Otwórz ustawienia Androida</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#f6f7f9;color:#18212d;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}
    main{max-width:420px;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001;text-align:center}
    a{display:block;background:#215ed5;color:white;text-decoration:none;border-radius:12px;padding:16px 20px;font-weight:700;margin:22px 0}
    p{line-height:1.5;color:#485263}
    small{color:#677183}
  </style>
</head>
<body><main>
<h1>Ustawienia Androida</h1>
<p>Naciśnij przycisk, aby spróbować otworzyć systemową aplikację Ustawienia.</p>
<a href="intent://#Intent;action=android.settings.SETTINGS;package=com.android.settings;end">Otwórz Settings</a>
<small>Przeglądarka lub Android mogą zablokować ten link. Nie zmienia on kodu PIN i nie usuwa blokady FRP.</small>
</main></body>
</html>
